<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>激活码管理 - 化工AI专业版</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .admin-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            flex: 1;
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            margin-top: 8px;
        }
        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .generate-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .generate-btn:hover {
            background: #219a52;
        }
        .filter-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        .codes-table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .codes-table th, .codes-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .codes-table th {
            background: #667eea;
            color: white;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status-unused {
            background: #27ae60;
            color: white;
        }
        .status-used {
            background: #95a5a6;
            color: white;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .copy-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 8px;
        }
        .back-btn {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .code-text {
            font-family: monospace;
            font-size: 14px;
        }
        .batch-input {
            width: 80px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <button class="back-btn" onclick="window.location.href='/'">← 返回首页</button>
        <h1>🔑 激活码管理</h1>
        
        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">-</div>
                <div class="stat-label">总用户数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="unusedCodes">-</div>
                <div class="stat-label">未使用激活码</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="usedCodes">-</div>
                <div class="stat-label">已使用激活码</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">¥99</div>
                <div class="stat-label">激活码价格（永久）</div>
            </div>
        </div>
        
        <div class="toolbar">
            <input type="number" id="codeCount" class="batch-input" value="10" min="1" max="100">
            <button id="generateBtn" class="generate-btn">+ 生成激活码</button>
            <div style="flex:1"></div>
            <button class="filter-btn" data-status="all">全部</button>
            <button class="filter-btn" data-status="unused">未使用</button>
            <button class="filter-btn" data-status="used">已使用</button>
        </div>
        
        <table class="codes-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>激活码</th>
                    <th>状态</th>
                    <th>价格</th>
                    <th>创建人</th>
                    <th>创建时间</th>
                    <th>使用人</th>
                    <th>使用时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="codesList">
            </tbody>
        </table>
    </div>
    <script>
        let currentStatus = 'all';
        
        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('totalUsers').textContent = data.stats.total_users;
                    document.getElementById('unusedCodes').textContent = data.stats.unused_codes;
                    document.getElementById('usedCodes').textContent = data.stats.used_codes;
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }
        
        async function loadCodes() {
            try {
                let url = '/api/admin/codes';
                if (currentStatus !== 'all') {
                    url += `?status=${currentStatus}`;
                }
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    const tbody = document.getElementById('codesList');
                    tbody.innerHTML = '';
                    
                    data.codes.forEach(code => {
                        const row = tbody.insertRow();
                        row.insertCell(0).textContent = code.id;
                        row.insertCell(1).innerHTML = `<span class="code-text">${code.code}</span>`;
                        row.insertCell(2).innerHTML = `<span class="status-badge status-${code.status}">${code.status === 'unused' ? '未使用' : '已使用'}</span>`;
                        row.insertCell(3).textContent = `¥${code.price}`;
                        row.insertCell(4).textContent = code.created_by || '-';
                        row.insertCell(5).textContent = new Date(code.created_at).toLocaleString();
                        row.insertCell(6).textContent = code.used_by || '-';
                        row.insertCell(7).textContent = code.used_at ? new Date(code.used_at).toLocaleString() : '-';
                        
                        const actionCell = row.insertCell(8);
                        
                        if (code.status === 'unused') {
                            const copyBtn = document.createElement('button');
                            copyBtn.textContent = '复制';
                            copyBtn.className = 'copy-btn';
                            copyBtn.onclick = () => copyCode(code.code);
                            actionCell.appendChild(copyBtn);
                        }
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.textContent = '删除';
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.onclick = () => deleteCode(code.id);
                        actionCell.appendChild(deleteBtn);
                    });
                } else {
                    alert('权限不足或登录已过期');
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('加载激活码失败:', error);
            }
        }
        
        async function generateCodes() {
            const count = document.getElementById('codeCount').value;
            if (count < 1 || count > 100) {
                alert('数量必须在1-100之间');
                return;
            }
            
            if (!confirm(`确定要生成 ${count} 个激活码吗？`)) return;
            
            try {
                const response = await fetch('/api/admin/generate-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count: parseInt(count) })
                });
                const data = await response.json();
                
                if (data.success) {
                    alert(`成功生成 ${data.count} 个激活码`);
                    loadCodes();
                    loadStats();
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('生成失败');
            }
        }
        
        async function deleteCode(id) {
            if (!confirm('确定要删除这个激活码吗？')) return;
            
            try {
                const response = await fetch(`/api/admin/codes/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    loadCodes();
                    loadStats();
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('删除失败');
            }
        }
        
        function copyCode(code) {
            navigator.clipboard.writeText(code);
            alert('激活码已复制到剪贴板');
        }
        
        document.getElementById('generateBtn').addEventListener('click', generateCodes);
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStatus = btn.dataset.status;
                loadCodes();
            });
        });
        
        // 默认激活第一个按钮
        document.querySelector('.filter-btn[data-status="all"]').classList.add('active');
        
        loadStats();
        loadCodes();
    </script>
</body>
</html>
