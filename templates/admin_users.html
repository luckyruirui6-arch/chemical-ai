<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 化工AI专业版</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .admin-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            flex: 1;
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            margin-top: 8px;
        }
        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
        }
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .users-table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .users-table th, .users-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .users-table th {
            background: #667eea;
            color: white;
        }
        .users-table tr:hover {
            background: #f5f5f5;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .role-admin {
            background: #e74c3c;
            color: white;
        }
        .role-user {
            background: #3498db;
            color: white;
        }
        .subscription-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .subscription-vip {
            background: #f39c12;
            color: white;
        }
        .subscription-free {
            background: #95a5a6;
            color: white;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover {
            background: #c0392b;
        }
        .back-btn {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .back-btn:hover {
            background: #5a67d8;
        }
        .export-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        .export-btn:hover {
            background: #219a52;
        }
        .empty-row {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
        .refresh-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <button class="back-btn" onclick="window.location.href='/'">← 返回首页</button>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>👥 用户管理</h1>
            <div>
                <button id="refreshBtn" class="refresh-btn">🔄 刷新</button>
                <button id="exportBtn" class="export-btn">📥 导出用户列表</button>
            </div>
        </div>
        
        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">-</div>
                <div class="stat-label">总用户数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="vipUsers">-</div>
                <div class="stat-label">VIP用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="freeUsers">-</div>
                <div class="stat-label">免费用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="adminUsers">-</div>
                <div class="stat-label">管理员</div>
            </div>
        </div>
        
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索用户名、邮箱...">
            <button id="searchBtn" class="refresh-btn">搜索</button>
        </div>
        
        <table class="users-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>邮箱</th>
                    <th>角色</th>
                    <th>会员类型</th>
                    <th>注册时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="usersList">
                <tr>
                    <td colspan="7" class="empty-row">加载中...</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script>
        let allUsers = [];
        
        // 加载统计信息
        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('totalUsers').textContent = data.stats.total_users;
                    // 需要从用户列表中计算其他统计
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }
        
        // 加载用户列表
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const data = await response.json();
                
                if (data.success) {
                    allUsers = data.users;
                    displayUsers(allUsers);
                    updateStats(allUsers);
                } else {
                    alert('权限不足或登录已过期');
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('加载用户失败:', error);
                document.getElementById('usersList').innerHTML = '<tr><td colspan="7" class="empty-row">加载失败，请刷新重试</td></tr>';
            }
        }
        
        // 显示用户列表
        function displayUsers(users) {
            const tbody = document.getElementById('usersList');
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-row">暂无用户数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            
            users.forEach(user => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = user.id;
                row.insertCell(1).innerHTML = `<strong>${escapeHtml(user.username)}</strong>`;
                row.insertCell(2).textContent = user.email || '-';
                row.insertCell(3).innerHTML = `<span class="role-badge role-${user.role}">${user.role === 'admin' ? '管理员' : '普通用户'}</span>`;
                row.insertCell(4).innerHTML = `<span class="subscription-badge subscription-${user.subscription_type}">${user.subscription_type === 'vip' ? 'VIP会员' : '免费用户'}</span>`;
                row.insertCell(5).textContent = new Date(user.created_at).toLocaleString();
                
                const actionCell = row.insertCell(6);
                if (user.username !== 'admin') {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = '删除';
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.onclick = () => deleteUser(user.username);
                    actionCell.appendChild(deleteBtn);
                } else {
                    actionCell.textContent = '-';
                }
            });
        }
        
        // 更新统计信息
        function updateStats(users) {
            let vipCount = 0;
            let freeCount = 0;
            let adminCount = 0;
            
            users.forEach(user => {
                if (user.role === 'admin') adminCount++;
                if (user.subscription_type === 'vip') vipCount++;
                if (user.subscription_type === 'free') freeCount++;
            });
            
            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('vipUsers').textContent = vipCount;
            document.getElementById('freeUsers').textContent = freeCount;
            document.getElementById('adminUsers').textContent = adminCount;
        }
        
        // 搜索用户
        function searchUsers() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!keyword) {
                displayUsers(allUsers);
                return;
            }
            
            const filtered = allUsers.filter(user => 
                user.username.toLowerCase().includes(keyword) ||
                (user.email && user.email.toLowerCase().includes(keyword))
            );
            displayUsers(filtered);
        }
        
        // 删除用户
        async function deleteUser(username) {
            if (!confirm(`确定要删除用户 "${username}" 吗？此操作不可恢复！`)) return;
            
            try {
                const response = await fetch(`/api/admin/users/${username}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('删除成功');
                    loadUsers();
                    loadStats();
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('删除失败');
            }
        }
        
        // 导出用户列表
        function exportUsers() {
            if (allUsers.length === 0) {
                alert('暂无数据可导出');
                return;
            }
            
            // 准备CSV数据
            const headers = ['ID', '用户名', '邮箱', '角色', '会员类型', '注册时间'];
            const rows = allUsers.map(user => [
                user.id,
                user.username,
                user.email || '',
                user.role === 'admin' ? '管理员' : '普通用户',
                user.subscription_type === 'vip' ? 'VIP会员' : '免费用户',
                new Date(user.created_at).toLocaleString()
            ]);
            
            const csvContent = [headers, ...rows].map(row => row.join(',')).join('\n');
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute('download', `users_${new Date().toISOString().slice(0,19)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
        
        // 防XSS攻击
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 事件绑定
        document.getElementById('refreshBtn').addEventListener('click', loadUsers);
        document.getElementById('exportBtn').addEventListener('click', exportUsers);
        document.getElementById('searchBtn').addEventListener('click', searchUsers);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchUsers();
        });
        
        // 页面加载
        loadUsers();
        loadStats();
    </script>
</body>
</html>
